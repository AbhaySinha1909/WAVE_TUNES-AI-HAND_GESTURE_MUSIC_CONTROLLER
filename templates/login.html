{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Wave Tunes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <video autoplay muted loop id="bgVideo">
        <source src="{% static 'media/bg.mp4' %}" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="container">
        <div class="card" id="login-card">
            <div class="toggle-btns">
                <button id="login-btn" class="active">Login</button>
                <button id="signup-btn">Sign Up</button>
            </div>
            <h2 id="form-title">Login</h2>
            <form id="auth-form">
                <div id="signup-extra-fields" style="display:none;">
                    <input type="text" id="name" placeholder="Full Name" required>
                    <input type="email" id="email" placeholder="Email Address" required>
                    <input type="text" id="mobile" placeholder="Mobile Number" required>
                </div>
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <input type="password" id="confirm-password" placeholder="Confirm Password" style="display:none;">
                <button type="submit" class="btn-primary" id="submit-btn">Login</button>
            </form>
        </div>

        <div class="card" id="dashboard-card" style="display:none;">
            <h2>Welcome, <span id="user-name"></span> 👋</h2>
            <p>Your connected devices are ready!</p>
            <div class="bluetooth-section">
                <h3>Connected Devices</h3>
                <ul id="device-list">
                    <li class="device-item">Speaker 1</li>
                    <li class="device-item">Headphones</li>
                </ul>
                <button id="connect-new" class="btn-primary">Connect New Device</button>
            </div>
            <button id="get-started" class="btn-primary">Start Music Player</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="close-modal">&times;</span>
            <h2>Connect New Device</h2>
            <p id="modal-text">Searching for Bluetooth devices...</p>
        </div>
    </div>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
